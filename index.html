<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polyglot Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>










:root {
  color-scheme: light;
  --background: 42 42% 95%;
  --foreground: 172 22% 17%;
  --border: 39 23% 85%;
  --input: 39 23% 85%;
  --card: 42 40% 98%;
  --card-foreground: 172 22% 17%;
  --primary: 169 47% 31%;
  --primary-foreground: 42 40% 98%;
  --secondary: 35 53% 88%;
  --secondary-foreground: 172 22% 17%;
  --muted: 42 23% 90%;
  --muted-foreground: 169 11% 43%;
  --accent: 13 59% 66%;
  --accent-foreground: 172 22% 17%;
  --destructive: 3 62% 48%;
  --destructive-foreground: 0 0% 100%;
  --ring: 169 47% 31%;
  --app-font-sans: 'DM Sans', 'Noto Sans Thai', sans-serif;
  --app-font-serif: 'Manrope', 'Noto Sans Thai', sans-serif;
  --app-font-mono: 'IBM Plex Mono', monospace;
  --radius: 1rem;
  --sidebar: 165 28% 18%;
  --sidebar-foreground: 42 35% 92%;
  --sidebar-border: 165 20% 26%;
  --shadow-soft: 0 18px 45px rgba(43, 67, 58, .08);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 320px;
  min-height: 100dvh;
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  font-family: var(--app-font-sans);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
::selection { background: hsl(169 47% 31% / .18); }

.app-shell { min-height: 100dvh; display: flex; }
.sidebar {
  width: 250px; flex: 0 0 250px; background: hsl(var(--sidebar));
  color: hsl(var(--sidebar-foreground)); display: flex; flex-direction: column;
  padding: 26px 16px 18px; min-height: 100dvh; position: sticky; top: 0; height: 100dvh;
}
.brand { display: flex; gap: 11px; align-items: center; padding: 0 12px 34px; }
.brand-mark { width: 34px; height: 34px; flex: 0 0 34px; overflow: hidden; border-radius: 11px; display:grid; place-items:center; color:#e4f0d9; background:#345f54; font-family:var(--app-font-serif); font-size:19px; font-weight:800; }
.brand-mark img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: 50% 44%; }
.brand-name { font-family:var(--app-font-serif); font-size:16px; letter-spacing:-.04em; font-weight:800; line-height:1.1; }
.brand-caption { display:block; color:#a8bcb1; font-family:var(--app-font-mono); font-size:9px; letter-spacing:.14em; margin-top:4px; text-transform:uppercase; }
.side-label { color:#91a99c; font: 10px var(--app-font-mono); letter-spacing:.15em; text-transform:uppercase; padding:0 13px; margin: 0 0 9px; }
.nav-stack { display:grid; gap:5px; }
.nav-group { display:grid; gap:3px; }
.nav-link { display:flex; align-items:center; gap:12px; border-radius:11px; color:#c5d3ca; font-size:13px; font-weight:600; padding:11px 13px; transition:background .18s ease,color .18s ease,transform .18s ease; }
.nav-link:hover { color:#fff; background:rgba(255,255,255,.07); transform:translateX(2px); }
.nav-link.active { color:#f5f3e8; background:#315d51; box-shadow:inset 3px 0 #df9b80; }
.nav-link svg { width:17px; height:17px; opacity:.85; }
.nav-substack { display:grid; gap:2px; margin:0 0 4px 22px; padding-left:10px; border-left:1px solid rgba(227,238,228,.17); }
.nav-sub-link { display:flex; align-items:center; gap:9px; min-height:34px; padding:7px 9px; border-radius:8px; color:#aebfb4; font-size:11px; font-weight:600; transition:background .18s ease,color .18s ease; }
.nav-sub-link:hover { color:#fff; background:rgba(255,255,255,.07); }
.nav-sub-link.active { color:#f5f3e8; background:rgba(49,93,81,.72); box-shadow:inset 2px 0 #df9b80; }
.nav-sub-link svg { width:14px; height:14px; flex:none; opacity:.85; }
.sidebar-bottom { margin-top:auto; }
.sync-card { border:1px solid rgba(227,238,228,.16); background:rgba(255,255,255,.05); border-radius:14px; padding:14px; margin:0 4px 18px; }
.sync-title { font-size:12px; font-weight:700; margin-bottom:5px; }
.sync-copy { font-size:11px; line-height:1.6; color:#a8bcb1; }
.sync-dot { display:inline-block; width:7px;height:7px;border-radius:50%; background:#9ac68d; margin-right:7px; }
.side-user { display:flex; align-items:center; gap:10px; padding:12px 10px 0; border-top:1px solid rgba(227,238,228,.13); }
.avatar { width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#e4b096;color:#24483e;font-size:11px;font-weight:800; }
.user-name { font-size:12px;font-weight:700; }
.user-caption { font-size:10px;color:#a8bcb1;margin-top:2px; }
.main-area { flex:1; min-width:0; padding:0 38px 60px; }
.topbar { height:75px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid hsl(var(--border)); margin-bottom:30px; }
.crumb { color:hsl(var(--muted-foreground)); font-size:12px; }
.crumb strong { color:hsl(var(--foreground)); font-weight:700; }
.top-actions { display:flex; align-items:center; gap:12px; }
.health { display:flex; align-items:center; gap:7px; color:hsl(var(--muted-foreground)); font-size:10px; font-family:var(--app-font-mono); text-transform:uppercase; letter-spacing:.06em; }
.health i { width:7px;height:7px;border-radius:50%;background:#6f9a79; display:block; }
.icon-button { border:1px solid hsl(var(--border)); width:36px;height:36px;border-radius:11px;background:hsl(var(--card)); color:hsl(var(--foreground)); display:grid;place-items:center; }
.page-heading { display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:26px; }
.eyebrow { font:10px var(--app-font-mono); text-transform:uppercase; letter-spacing:.16em; color:hsl(var(--primary)); margin-bottom:9px; }
h1,h2,h3,p { margin-top:0; }
h1 { font-family:var(--app-font-serif); letter-spacing:-.055em; font-weight:700; font-size:clamp(28px,3.4vw,42px); line-height:1.06; margin-bottom:9px; }
.subtitle { color:hsl(var(--muted-foreground)); font-size:13px; line-height:1.6; margin-bottom:0; }
.button { border:0; border-radius:11px; padding:11px 16px; min-height:42px; display:inline-flex; align-items:center;justify-content:center;gap:9px; font-size:12px;font-weight:700; transition:transform .18s, background .18s, box-shadow .18s; }
.button:hover { transform:translateY(-1px); }
.button-primary { background:hsl(var(--primary));color:#f7f4e8;box-shadow:0 5px 13px rgba(35,85,72,.14); }
.button-primary:hover { background:#1f5c50; }
.button-soft { background:#e8e4d7;color:#335d51; }
.button-outline { border:1px solid hsl(var(--border));background:transparent;color:hsl(var(--foreground)); }
.button-danger { background:#f5e5df;color:#a23f31; }
.button:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.panel { background:hsl(var(--card)); border:1px solid hsl(var(--border)); border-radius:18px; box-shadow:var(--shadow-soft); }
.panel-pad { padding:22px; }
.stat-grid { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px; }
.stat-card { padding:18px 19px; min-height:120px; position:relative; overflow:hidden; }
.stat-top { display:flex;justify-content:space-between;align-items:center;color:hsl(var(--muted-foreground));font-size:11px;font-weight:600; }
.stat-icon { width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:#e7eee5;color:#367265; }
.stat-value { font:700 32px var(--app-font-serif); letter-spacing:-.06em; margin-top:13px; }
.stat-foot { color:hsl(var(--muted-foreground));font-size:10px;margin-top:2px; }
.dashboard-grid { display:grid;grid-template-columns:1.55fr .9fr;gap:15px;margin-top:15px; }
.onboarding-panel { margin: 15px 0; padding: 21px; }
.onboarding-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:17px; }
.onboarding-heading h2 { margin:5px 0 4px; font:700 19px var(--app-font-serif); letter-spacing:-.04em; }
.onboarding-heading p { margin:0; color:hsl(var(--muted-foreground)); font-size:11px; line-height:1.55; }
.onboarding-count { display:flex; align-items:baseline; gap:5px; padding:8px 11px; border-radius:12px; background:#e8efe4; color:#315c50; font:700 18px var(--app-font-serif); white-space:nowrap; }
.onboarding-count small { color:#6d8175; font:9px var(--app-font-mono); text-transform:uppercase; letter-spacing:.06em; }
.onboarding-steps { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.onboarding-step { display:flex; flex-direction:column; min-width:0; min-height:176px; padding:14px; border:1px solid hsl(var(--border)); border-radius:14px; background:#fbfaf5; }
.onboarding-step.is-current { border-color:#9ebaa8; background:#f3f6ee; }
.onboarding-step.is-complete { border-color:#d5dfd3; background:#f6f7f0; }
.onboarding-step.is-locked { background:#f5f3ec; }
.onboarding-step-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.onboarding-step-number { display:grid; place-items:center; width:27px; height:27px; flex:0 0 27px; border-radius:9px; background:#e7eee5; color:#386b5d; font:11px var(--app-font-mono); }
.onboarding-step.is-complete .onboarding-step-number { background:#dce9dc; }
.onboarding-step.is-locked .onboarding-step-number { background:#ece9df; color:#899187; }
.onboarding-step h3 { margin:0 0 5px; font:700 14px var(--app-font-serif); }
.onboarding-step p { margin:0 0 12px; color:hsl(var(--muted-foreground)); font-size:10px; line-height:1.55; }
.onboarding-step-link { display:inline-flex; align-items:center; gap:6px; margin-top:auto; color:#315f53; font-size:10px; font-weight:700; text-decoration:none; }
.onboarding-step-link:hover { color:#1f5c50; text-decoration:underline; }
.onboarding-locked-note { margin-top:auto; color:#8a9188; font-size:9px; }
.onboarding-creative-links { display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; }
.onboarding-creative-links a { display:inline-flex; align-items:center; padding:7px 8px; border:1px solid #d7dfd2; border-radius:9px; color:#315f53; background:#fffef8; font-size:9px; font-weight:700; text-decoration:none; }
.onboarding-creative-links a:hover { border-color:#9ebaa8; background:#eef3eb; }
.section-title { display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px; }
.section-title h2 { font:700 17px var(--app-font-serif);letter-spacing:-.04em;margin:0; }
.section-kicker { font:10px var(--app-font-mono);color:hsl(var(--muted-foreground));letter-spacing:.08em;text-transform:uppercase; }
.chart { display:flex;align-items:flex-end;gap:clamp(8px,2.6vw,22px);height:144px;padding:10px 4px 0;border-bottom:1px solid hsl(var(--border)); }
.chart-day { flex:1;display:flex;flex-direction:column;align-items:center;gap:8px; height:100%;justify-content:flex-end; }
.bar-track { width:100%;max-width:28px;height:110px;display:flex;align-items:flex-end; }
.bar-fill { width:100%;min-height:4px;border-radius:6px 6px 2px 2px;background:#83a998;transition:transform .2s; }
.bar-fill.today { background:#d98f72; }
.chart-day small { color:hsl(var(--muted-foreground));font:9px var(--app-font-mono); }
.progress-callout { background:#e8efe4;border-radius:14px;padding:17px;margin-top:20px;display:flex;gap:14px;align-items:center; }
.ring { width:55px;height:55px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#316b5d var(--progress),#d3dfd2 0);position:relative;flex:none; }
.ring:after { content:'';position:absolute;inset:5px;background:#e8efe4;border-radius:50%; }
.ring span { position:relative;z-index:1;font:11px var(--app-font-mono);color:#315c50; }
.callout-title {font-size:13px;font-weight:700;margin-bottom:4px}
.callout-text {font-size:11px;color:#677a6d;line-height:1.5}
.review-list { display:grid;gap:9px; }
.review-row { display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid hsl(var(--border));border-radius:13px;background:#fbfaf5; }
.word-main {font-size:16px;font-weight:700;line-height:1.25}
.word-meta {font-size:11px;color:hsl(var(--muted-foreground));margin-top:4px}
.tag { display:inline-flex;align-items:center;border-radius:20px;padding:5px 8px;background:#edf0e9;color:#557165;font:9px var(--app-font-mono);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap; }
.review-actions { display:flex;gap:5px; }
.mini-action { border:1px solid hsl(var(--border));width:28px;height:28px;border-radius:9px;background:hsl(var(--card));display:grid;place-items:center;color:#42695d; }
.mini-action:hover {background:#e8efe4}
.empty-state { border:1px dashed #c8caba;border-radius:15px;padding:30px 18px;text-align:center;color:hsl(var(--muted-foreground));background:#faf9f4; }
.empty-state h3 {font:700 16px var(--app-font-serif);color:hsl(var(--foreground));margin:10px 0 6px}
.empty-state p {font-size:12px;line-height:1.6;margin:0 auto 14px;max-width:300px}
.loading-lines { display:grid;gap:10px;padding:8px 0; }
.skeleton {height:12px;border-radius:10px;background:linear-gradient(90deg,#ecebe1,#f7f6ef,#ecebe1);background-size:200%;animation:shimmer 1.35s infinite linear}
@keyframes shimmer {to {background-position:-200% 0}}
.error-box { padding:16px;border:1px solid #e6c5ba;background:#fbede7;color:#8e4334;border-radius:12px;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:12px; }
.toolbar { display:flex;align-items:center;gap:10px;margin-bottom:17px;flex-wrap:wrap; }
.search-wrap { position:relative;flex:1;min-width:220px; }
.search-wrap svg {position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#819188}
.field, .select, .textarea { border:1px solid hsl(var(--border));background:#fcfbf6;color:hsl(var(--foreground));border-radius:10px;padding:11px 12px;font-size:12px;outline:none;width:100%; }
.search-wrap .field {padding-left:39px}
.field:focus,.select:focus,.textarea:focus {border-color:#6c9a8a;box-shadow:0 0 0 3px rgba(67,130,108,.12)}
.vocab-table {width:100%;border-collapse:collapse}
.vocab-table th {text-align:left;color:#829087;font:9px var(--app-font-mono);text-transform:uppercase;letter-spacing:.1em;padding:12px 10px;border-bottom:1px solid hsl(var(--border))}
.vocab-table td {padding:14px 10px;border-bottom:1px solid #efeee7;font-size:12px;vertical-align:middle}
.vocab-table tr:last-child td {border-bottom:0}
.thai-word {font-family:'Noto Sans Thai',sans-serif;font-size:17px;font-weight:600;line-height:1.25}
.translation {font-size:11px;color:hsl(var(--muted-foreground));margin-top:4px}
.table-actions {display:flex;gap:5px;justify-content:flex-end}
.table-wrap {overflow:auto}
.modal-backdrop {position:fixed;inset:0;z-index:30;background:rgba(21,39,32,.42);display:grid;place-items:center;padding:18px;animation:fadein .18s ease}
.modal {width:min(640px,100%);max-height:92dvh;overflow:auto;background:#faf9f4;border:1px solid hsl(var(--border));border-radius:20px;padding:24px;box-shadow:0 25px 70px rgba(22,48,38,.2);animation:rise .24s ease}
.import-modal {width:min(960px,100%);padding:25px}
.import-intro {display:flex;align-items:center;gap:14px;padding:15px 17px;background:#edf1e8;border-radius:14px;margin-bottom:17px}
.import-symbol {width:39px;height:39px;flex:none;display:grid;place-items:center;border-radius:12px;background:#dce8dc;color:#376b5c}
.import-intro strong {display:block;font-size:12px;margin-bottom:4px}
.import-intro span {color:#738177;font-size:11px;line-height:1.5}
.import-drop {border:1px dashed #aebdaf;background:#f6f6ef;border-radius:15px;padding:21px;text-align:center;display:flex;align-items:center;justify-content:center;gap:13px}
.import-drop.has-file {border-style:solid;background:#f0f3e9}
.import-drop-copy {text-align:left}
.import-drop-copy strong {font-size:12px;display:block;margin-bottom:4px}
.import-drop-copy span {font-size:10px;color:#78857b}
.import-summary {display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
.import-count {padding:7px 10px;border-radius:9px;background:#e7eee5;color:#3d6c5c;font:10px var(--app-font-mono)}
.import-count.invalid {background:#f7e9e2;color:#9b4d3b}
.import-count.duplicate {background:#f4efdf;color:#8a7140}
.import-preview {border:1px solid hsl(var(--border));border-radius:12px;overflow:auto;max-height:310px}
.import-table {width:100%;border-collapse:collapse;min-width:760px}
.import-table th {position:sticky;top:0;background:#f2f2e9;color:#748278;text-align:left;font:9px var(--app-font-mono);text-transform:uppercase;letter-spacing:.09em;padding:10px}
.import-table td {font-size:10px;padding:9px 10px;border-top:1px solid #ecebe3;vertical-align:top;max-width:170px;overflow-wrap:anywhere}
.import-row-invalid td {background:#fff8f5}
.import-row-duplicate td {background:#fbf8ee}
.row-status {display:inline-flex;align-items:center;gap:4px;font:9px var(--app-font-mono);text-transform:uppercase;white-space:nowrap}
.row-status.valid {color:#42755f}.row-status.invalid {color:#a34d3d}.row-status.duplicate {color:#947940}
.import-warning {padding:10px 12px;background:#fbede7;color:#93483a;border-radius:10px;font-size:11px;margin-top:12px}
.import-progress {height:5px;border-radius:5px;background:#e3e6dc;overflow:hidden;margin-top:12px}
.import-progress span {display:block;height:100%;background:#4f8671;transition:width .2s}
.import-template {font-size:10px;color:#738177;margin-top:10px;line-height:1.6}
.vocab-heading-actions {display:flex;gap:8px}
@keyframes fadein {from{opacity:0}to{opacity:1}}
@keyframes rise {from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.modal-head {display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.modal-head h2 {font:700 22px var(--app-font-serif);letter-spacing:-.04em;margin:0 0 5px}
.modal-head p {font-size:12px;color:hsl(var(--muted-foreground));margin:0}
.close-button {border:0;background:transparent;color:#64786e;padding:5px}
.form-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-field {display:grid;gap:6px}
.form-field.full {grid-column:1/-1}
.form-field label {font:10px var(--app-font-mono);text-transform:uppercase;letter-spacing:.08em;color:#61776b}
.form-footer {display:flex;justify-content:flex-end;gap:8px;margin-top:19px}
.field-help {font-size:10px;color:#849087}
.practice-layout {display:grid;grid-template-columns:minmax(260px,.82fr) minmax(360px,1.18fr);gap:16px;align-items:start}
.word-picker {max-height:280px;overflow:auto;display:grid;gap:7px;margin-top:12px}
.pick-row {display:flex;align-items:center;gap:10px;padding:10px;border:1px solid hsl(var(--border));border-radius:11px;background:#fcfbf6;cursor:pointer}
.pick-row input {accent-color:#32695c;width:15px;height:15px}
.pick-row-title {font-weight:700;font-size:12px}
.pick-row-sub {font-size:10px;color:hsl(var(--muted-foreground));margin-top:2px}
.choice-row {display:flex;gap:7px;flex-wrap:wrap}
.choice {border:1px solid hsl(var(--border));background:transparent;border-radius:9px;padding:8px 11px;color:#61776b;font-size:11px;font-weight:600}
.choice.selected {border-color:#386f60;background:#e6efe7;color:#285e51}
.result-card {padding:22px}
.result-item {padding:17px 0;border-bottom:1px solid hsl(var(--border))}
.result-item:last-child {border-bottom:0;padding-bottom:0}
.speaker {font:10px var(--app-font-mono);color:#b2755d;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.result-text {font-family:'Noto Sans Thai','DM Sans',sans-serif;font-size:20px;line-height:1.6;font-weight:600}
.result-translation {font-size:13px;color:#577268;line-height:1.6;margin-top:7px}
.result-note {font-size:11px;color:#849087;line-height:1.6;margin-top:8px}
.chips {display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.practice-aside {padding:18px}
.account-grid {display:grid;grid-template-columns:1fr .8fr;gap:15px}
.dropzone {border:1px dashed #b8c4b5;background:#f4f5ed;border-radius:14px;padding:28px;text-align:center}
.dropzone svg {color:#52796c}
.dropzone h3 {font:700 16px var(--app-font-serif);margin:10px 0 5px}
.dropzone p {font-size:11px;color:#7c8980;line-height:1.6;margin:0 auto 14px;max-width:340px}
.result-banner {padding:14px 16px;background:#e6efe6;border:1px solid #ceddce;color:#315d50;border-radius:12px;font-size:12px;line-height:1.6;margin-top:14px}

/* ===== Tablet / phone responsive overrides ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.toast{bottom:calc(22px + env(safe-area-inset-bottom,0px))}
@media(max-width:900px) {
  .app-shell{display:block}
  .sidebar{position:fixed;z-index:20;left:0;top:0;bottom:0;height:auto;width:min(300px,84vw);transform:translateX(-100%);transition:transform .25s ease,box-shadow .25s ease;box-shadow:none;overflow-y:auto;overscroll-behavior:contain;padding-top:calc(26px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:calc(16px + env(safe-area-inset-left,0px))}
  .sidebar.open{transform:translateX(0);box-shadow:20px 0 40px rgba(19,40,32,.15)}

  .creation-word-list{max-height:200px}

  /* readable text sizes */

  .onboarding-heading p,.onboarding-step p,.onboarding-step-link,.onboarding-locked-note,.onboarding-creative-links a,
  .creation-step small,.creation-word-copy small,.creation-empty p,.creation-message,.creation-footnote,

  .pick-row-sub,.import-drop-copy span,.import-intro span,.creation-inline-error{font-size:12px}

=\"row\" style=\"margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #e5e7eb;\">\n      <div>\n        <label>หัวข้อกระดาษ<\/label>\n        <input type=\"text\" id=\"headerTitle\" value=\"แบบฝึกคัดคำศัพท์พื้นฐาน | Vocabulary Tracing Worksheet\">\n      <\/div>\n      <div>\n        <label>หัวข้อย่อย / ชื่อสถาบัน<\/label>\n        <input type=\"text\" id=\"headerSub\" value=\"PolyglotLearning & TracingStudioPro\">\n      <\/div>\n    <\/div>\n\n    <div class=\"row\">\n      <div>\n        <label>ประเภทแบบฝึก<\/label>\n        <select id=\"style\">\n          <option value=\"cross\">🇰🇷🇨🇳🇯🇵 กล่องกากบาท<\/option>\n          <option value=\"lines\" selected>🇬🇧 เส้น 4 ชั้น<\/option>\n        <\/select>\n      <\/div>\n      <div>\n        <label>จำนวนคำต่อหน้า<\/label>\n        <select id=\"wordsPerPage\">\n          <option value=\"1\">1 คำ (ช่องใหญ่)<\/option>\n          <option value=\"2\" selected>2 คำ (มาตรฐาน)<\/option>\n          <option value=\"4\">4 คำ (ประหยัดกระดาษ)<\/option>\n        <\/select>\n      <\/div>\n    <\/div>\n\n    <div class=\"row\">\n      <div>\n        <label for=\"worksheetMode\">กิจกรรมในใบงาน<\/label>\n        <select id=\"worksheetMode\">\n          <option value=\"trace\">คัดตามรอยและเขียนเอง<\/option>\n          <option value=\"match\">จับคู่คำศัพท์กับคำแปล<\/option>\n          <option value=\"compound\">คำประสม A + B = C (การ์ดรูป + คัดตามรอย)<\/option>\n          <option value=\"fill\">เติมตัวอักษรที่หายไป (การ์ดรูป)<\/option>\n          <option value=\"picmatch\">จับคู่รูปภาพกับคำ (ลากเส้นโยง)<\/option>\n          <option value=\"scramble\">เรียงตัวอักษรให้เป็นคำ (การ์ดรูป)<\/option>\n        <\/select>\n      <\/div>\n      <div id=\"traceLayoutWrap\">\n        <label for=\"traceLayout\">รูปแบบตาราง (โหมดคัดตามรอย)<\/label>\n        <select id=\"traceLayout\">\n          <option value=\"classic\">แบบเดิม<\/option>\n          <option value=\"cards\">ตารางการ์ดรูป (หลายคอลัมน์)<\/option>\n        <\/select>\n      <\ \" id=\"answerKeyRow\" style=\"display:none\"><input type=\"checkbox\" id=\"answerKey\" checked> <span>เพิ่มหน้าเฉลยในไฟล์ที่พิมพ์หรือบันทึก<\/span><\/label>\n\n    <div class=\"row\">\n      <div>\n        <label>สไตล์ตัวอักษร (Font Style)<\/label>\n        <select id=\"fontStyle\">\n          <option value=\"normal\">มาตรฐาน (Standard)<\/option>\n          <option value=\"caveat\">🇬🇧 ตัวเขียนต่อเนื่อง (Cursive)<\/option>\n          <option value=\"nanum-pen\">🇰🇷 ลายมือเกาหลี (Nanum Pen)<\/option>\n          <option value=\"klee-one\">🇯🇵 พู่กันญี่ปุ่น (Klee One)<\/option>\n          <option value=\"yomogi\">🇯🇵 ลายมือน่ารักญี่ปุ่น (Yomogi)<\/option>\n          <option value=\"ma-shan-zheng\">🇨🇳 พู่กันจีน (Ma Shan Zheng)<\/option>\n        <\/select>\n      <\/div>\n    <\/div>\n\n    <div class=\"row\">\n      <div>\n        <label>จำนวนแถว: <strong><span id=\"rowV\">4<\/span><\/strong><\/label>\n        <input type=\"range\" id=\"rowCount\" min=\"1\" max=\"10\" value=\"4\">\n      <\/div>\n      <div>\n        <label>ช่องต่อแถว: <strong><span id=\"colV\">12<\/span><\/strong><\/label>\n        <input type=\"range\" id=\"colCount\" min=\"1\" max=\"20\" value=\"12\">\n      <\/div>\n    <\/div>\n\n    <div class=\"row\">\n      <div>\n        <label>ระยะห่างแถวแนวตั้ง: <strong><span id=\"gapV\">10<\/span> px<\/strong><\/label>\n        <input type=\"range\" id=\"rowGap\" min=\"0\" max=\"40\" value=\"10\">\n      <\/div>\n      <div>\n        <label>ระยะห่างตัวอักษร: <strong><span id=\"letterGapV\">0<\/span> px<\/strong><\/label>\n        <input type=\"range\" id=\"letterGap\" min=\"-8\" max=\"40\" value=\"0\">\n      <\/div>\n    <\/div>\n\n    <div class=\"row\">\n      <div>\n        <label>ขนาดตัวอักษร: <strong><span id=\"fontSizeV\">22<\/span> px<\/strong><\/label>\n        <input type=\"range\" id=\"fontSize\" min=\"12\" max=\"60\" value=\"22\">\n      <\/div>\n      <div>\n        <label>ขนาดช่องสูงสุด: <strong><span id=\"cellSizeV\">100<\/span>%<\/strong><\/label>\n        <input type=\"range\" id=\"cellSize\" min=\"20\" max=\"100\" value=\"100\">\n      <\/div>\n    <\/div>\n\n    <div class=\"row\">\n      <div>\n        <label>สไตล์ตัวอักษร<\/label>\n        <select id=\"textStyle\">\n          <option value=\"solid\">ทึบ (สีเทา)<\/option>\n          <option value=\"outline\">เส้นขอบโปร่ง (ลากทับ)<\/option>\n        <\/select>\n      <\/div>\n      <div>\n        <label>แสดงตัวอย่าง<\/label>\n        <select id=\"exampleMode\">\n          <option value=\"first\">เฉพาะแถวแรก<\/option>\n          <option value=\"all\">ทุกแถว<\/option>\n          <option value=\"none\">ไม่แสดงเลย<\/option>\n        <\/select>\n      <\/div>\n    <\/div>\n\n    <div class=\"row\" style=\"margin-top:15px\">\n  <div>\n    <label>รูปแบบเส้น (โหมดเส้น 4 ชั้น)<\/label>\n    <select id=\"lineStyle\">\n      <option value=\"three\" selected>3 เส้น แดง-ประ-น้ำเงิน (เดิม)<\/option>\n      <option value=\"four\">4 เส้น (บน-กลางประ-ฐาน-ล่างประ)<\/option>\n      <option value=\"mono3\">3 เส้น สีเทา<\/option>\n      <option value=\"two\">2 เส้น (กลางประ + เส้นฐาน)<\/option>\n      <option value=\"base\">เส้นฐานเส้นเดียว<\/option>\n      <option value=\"box\">ช่องสี่เหลี่ยม + เส้นกลางประ<\/option>\n      <option value=\"none\">ไม่มีเส้นแนวนอน<\/option>\n    <\/select>\n  <\/div>\n  <div>\n    <label>ตำแหน่งช่องตัวอย่างคำศัพท์<\/label>\n    <select id=\"cardPos\">\n      <option value=\"left\" selected>ซ้าย (เดิม)<\/option>\n      <option value=\"right\">ขวา<\/option>\n      <option value=\"top\">ด้านบน (แถบแนวนอน)<\/option>\n      <option value=\"bottom\">ด้านล่าง (แถบแนวนอน)<\/option>\n      <option value=\"hide\">ซ่อนช่องตัวอย่าง<\/option>\n    <\/select>\n  <\/div>\n<\/div>\n<div class=\"row\" style=\"margin-top: 15px; padding: 15px; background: #eef2ff; border-radius: 8px; display: flex; flex-direction: column;\">\n      <label class=\"checkbox-group\"><input type=\"checkbox\" id=\"showStars\"> <span>🌟 แสดงดาวให้คะแนน<\/span><\/label>\n      <label class=\"checkbox-group\"><input type=\"checkbox\" id=\"showStartDot\" checked> <span>📍 แสดงจุดเริ่มต้นขีด (CJK)<\/span><\/label>\n      <label class=\"checkbox-group\"><input type=\"checkbox\" id=\"freehandMode\"> <span>📚 เพิ่มแถวเขียนอิสระ<\/span><\/label>\n      <label class=\"checkbox-group\"><input type=\"checkbox\" id=\"inkSaver\"> <span>🖨️ ประหยัดหมึกพิมพ์<\/span><\/label>\n      <label class=\"checkbox-group\"><input type=\"checkbox\" id=\"squareMode\" checked> <span>ช่องสี่เหลี่ยมจัตุรัส<\/span><\/label>\n      <label class=\"checkbox-group\"><input type=\"checkbox\" id=\"hideDash\"> <span>ซ่อนเส้นประแนวตั้งคั่นช่อง<\/span><\/label>\n    <\/div>\n\n    <label style=\"margin-top: 20px;\">💾 ชุดตั้งค่าที่บันทึกไว้<\/label><div class=\"row\" style=\"gap:8px;flex-wrap:nowrap\"><select id=\"psSel\" style=\"flex:1\"><\/select><button type=\"button\" id=\"psLoad\" style=\"flex:0 0 auto;min-width:0;padding:10px 14px\">โหลด<\/button><button type=\"button\" id=\"psDel\" style=\"flex:0 0 auto;min-width:0;padding:10px 14px;background:#e5e7eb;color:#374151\">ลบ<\/button><\/div><div class=\"row\" style=\"gap:8px;margin-top:8px;flex-wrap:nowrap\"><input type=\"text\" id=\"psName\" placeholder=\"ชื่อชุด เช่น ชุดสอนเด็ก\" style=\"flex:1\"><button type=\"button\" id=\"psSave\" class=\"btn-image\" style=\"flex:0 0 auto;min-width:0;padding:10px 14px\">บันทึกชุดนี้<\/button><\/div><label style=\"margin-top: 20px;\">📄 ขนาดกระดาษ<\/label><select id=\"paperSize\"><option value=\"a4\">A4<\/option><option value=\"a5\">A5 (เล็ก ประหยัดกระดาษ)<\/option><option value=\"letter\">Letter<\/option><\/select><label style=\"margin-top: 20px;\">📦 คลังคำศัพท์สำเร็จรูป<\/label>\n    <select id=\"preset\" style=\"margin-bottom:8px;\">\n      <option value=\"\">-- เลือกหมวดคำศัพท์ --<\/option>\n      <option value=\"kr-basic\">🇰🇷 คำกริยาพื้นฐานเกาหลี<\/option>\n      <option value=\"kr-fruit\">🇰🇷 หมวดผลไม้เกาหลี<\/option>\n      <option value=\"kr-animals\">🇰🇷 หมวดสัตว์เกาหลี<\/option>\n      <option value=\"kr-color\">🇰🇷 หมวดสีเกาหลี<\/option>\n      <option value=\"kr-body\">🇰🇷 หมวดอวัยวะร่างกายเกาหลี<\/option>\n      <option value=\"kr-food\">🇰🇷 หมวดอาหารเกาหลี<\/option>\n      <option value=\"kr-family\">🇰🇷 หมวดครอบครัวเกาหลี<\/option>\n      <option value=\"kr-compound\">🇰🇷 คำประสมเกาหลี (물+고기=물고기)<\/option>\n      <option value=\"en-fruit\">🇬🇧 หมวดผลไม้ภาษาอังกฤษ<\/option>\n      <option value=\"en-color\">🇬🇧 หมวดสีภาษาอังกฤษ<\/option>\n      <option value=\"en-body\">🇬🇧 หมวดอวัยวะร่างกายภาษาอังกฤษ<\/option>\n      <option value=\"en-food\">🇬🇧 หมวดอาหารภาษาอังกฤษ<\/option>\n      <option value=\"en-family\">🇬🇧 หมวดครอบครัวภาษาอังกฤษ<\/option>\n      <option value=\"en-animals\" selected>🇬🇧 หมวดสัตว์ภาษาอังกฤษ<\/option>\n    <\/select>\n    \n    <div id=\"compoundWrap\" style=\"display:none\"><label>รายการคำประสม (ส่วนที่ 1 | ส่วนที่ 2 | คำรวม — แต่ละส่วนเขียนเป็น คำ;คำอ่าน;คำแปล;อิโมจิ;รูป — ช่อง \"รูป\" ใส่ชื่อรูปจากคลังด้านล่าง หรือลิงก์ https ก็ได้)<\/label><textarea id=\"compoundInput\" rows=\"6\" style=\"font-size:14px;\">물;mul;Water;💧|고기;go-gi;Meat;🥩|물고기;mul-go-gi;Fish;🐟\n눈;nun;Eye;👁️|물;mul;Water;💧|눈물;nun-mul;Tears;😢\n불;bul;Fire;🔥|고기;go-gi;Meat;🥩|불고기;bul-go-gi;Bulgogi;🍖\n김;gim;Seaweed;🌿|밥;bap;Rice;🍚|김밥;gim-bap;Gimbap;🍙<\/textarea><\/div>\n    <label>รายการคำศัพท์ (คำ|คำอ่าน|คำแปล|อิโมจิ|[URL/ชื่อรูป]|[คำแปลอังกฤษ])<\/label>\n    <textarea id=\"wordsInput\" rows=\"6\" style=\"font-size:14px;\">Cat|kæt|แมว|🐱|\nDog|dɒg|สุนัข|🐶|\nBird|bɜːd|นก|🐦|\nFish|fɪʃ|ปลา|🐟|<\/textarea>\n    <div id=\"imgLibWrap\"><label style=\"margin-top:12px\">🖼️ คลังรูปภาพ — เลือกรูปจากเครื่อง แล้ววางเคอร์เซอร์ไว้ในบรรทัดคำที่ต้องการ จากนั้นแตะรูปเพื่อใส่ชื่อรูปให้คำนั้น (โหมดคำประสมจะแทรกชื่อที่เคอร์เซอร์)<\/label><input type=\"file\" id=\"cmpImgFile\" accept=\"image/*\" multiple><div id=\"cmpImgList\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:8px\"><\/div><\/div>\n    \n    <div class=\"btn-row\">\n      <button class=\"btn-print\" onclick=\"window.print()\">🖨️ พิมพ์ / PDF<\/button>\n      <button class=\"btn-image\" id=\"btnDownload\">📷 เซฟรูป<\/button>\n      <button class=\"btn-image\" id=\"btnZip\">🗜️ เซฟรูปทุกหน้า (ZIP)<\/button>\n      <button class=\"btn-print\" id=\"btnPdf\">📄 บันทึก PDF<\/button>\n      <button class=\"btn-reset\" onclick=\"localStorage.removeItem('tracingAppSettings'); location.reload();\">🔄 รีเซ็ตการตั้งค่า<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"sheet-container\" id=\"pagesContainer\"><\/div>\n<div class=\"loading\" id=\"loading\">กำลังบันทึกรูปภาพ...<\/div>\n\n<script>\nfunction switchTab(tab) {\n  if (tab === 'settings') {\n    document.body.classList.remove('view-preview');\n    document.body.classList.add('view-settings');\n    $('tabSettings').classList.add('active');\n    $('tabPreview').classList.remove('active');\n  } else {\n    document.body.classList.remove('view-settings');\n    document.body.classList.add('view-preview');\n    $('tabPreview').classList.add('active');\n    $('tabSettings').classList.remove('active');\n    \n    fitPreview();\n  }\n}\nfunction fitPreview(){\n  const pages=document.querySelectorAll('.page-a4');\n  if(!window.matchMedia('(max-width: 900px)').matches){\n    pages.forEach(p=>{p.style.transform='';p.style.marginBottom=''});\n    return;\n  }\n  if(!document.body.classList.contains('view-preview'))return;\n  const containerWidth=document.body.clientWidth,page=pages[0];\n  if(!page)return;\n  const scale=Math.min(1,(containerWidth-24)/page.offsetWidth);\n  pages.forEach(p=>{\n    p.style.transform=`scale(${scale})`;\n    p.style.marginBottom=`-${p.offsetHeight*(1-scale)-20}px`;\n  });\n}\nwindow.addEventListener('resize',()=>requestAnimationFrame(fitPreview));\nwindow.addEventListener('orientationchange',()=>setTimeout(fitPreview,250));\n\nconst $ = id => document.getElementById(id);\nconst PRESETS = {\n  'kr-basic': `가다|gada|ไป|🚶|https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Strokes_ga.svg/100px-Strokes_ga.svg.png\\n오다|oda|มา|👋|\\n쓰다|sseuda|เขียน|✍️|\\n읽다|ilkda|อ่าน|📖|`,\n  'kr-fruit': `사과|sagwa|แอปเปิ้ล|🍎|\\n바나나|banana|กล้วย|🍌|\\n포도|podo|องุ่น|🍇|\\n딸기|ttalgi|สตรอเบอร์รี่|🍓|`,\n  'en-fruit': `Apple|ˈæp.l|แอปเปิ้ล|🍎|\\nBanana|bəˈnɑː.nə|กล้วย|🍌|\\nOrange|ˈɒr.ɪndʒ|ส้ม|🍊|\\nGrape|ɡreɪp|องุ่น|🍇|`,\n  'kr-animals': `고양이|go-yang-i|แมว|🐱||Cat\\n강아지|gang-a-ji|ลูกสุนัข|🐶||Puppy\\n새|sae|นก|🐦||Bird\\n물고기|mul-go-gi|ปลา|🐟||Fish\\n토끼|to-kki|กระต่าย|🐰||Rabbit\\n곰|gom|หมี|🐻||Bear\\n말|mal|ม้า|🐴||Horse\\n소|so|วัว|🐮||Cow\\n돼지|dwae-ji|หมู|🐷||Pig\\n닭|dak|ไก่|🐔||Chicken`,\n  'kr-color': `빨강|ppal-gang|แดง|❤️||Red\\n파랑|pa-rang|น้ำเงิน/ฟ้า|💙||Blue\\n노랑|no-rang|เหลือง|💛||Yellow\\n초록|cho-rok|เขียว|💚||Green\\n하양|ha-yang|ขาว|🤍||White\\n검정|geom-jeong|ดำ|🖤||Black\\n보라|bo-ra|ม่วง|💜||Purple\\n주황|ju-hwang|ส้ม|🧡||Orange\\n분홍|bun-hong|ชมพู|🩷||Pink\\n갈색|gal-saek|น้ำตาล|🤎||Brown`,\n  'kr-body': `눈|nun|ตา|👁️||Eye\\n코|ko|จมูก|👃||Nose\\n입|ip|ปาก|👄||Mouth\\n귀|gwi|หู|👂||Ear\\n손|son|มือ|✋||Hand\\n발|bal|เท้า|🦶||Foot\\n다리|da-ri|ขา|🦵||Leg\\n팔|pal|แขน|💪||Arm\\n이|i|ฟัน|🦷||Tooth\\n혀|hyeo|ลิ้น|👅||Tongue`,\n  'kr-food': `밥|bap|ข้าว|🍚||Rice\\n물|mul|น้ำ|💧||Water\\n고기|go-gi|เนื้อ|🥩||Meat\\n김치|gim-chi|กิมจิ|🥬||Kimchi\\n김밥|gim-bap|กิมบับ|🍙||Gimbap\\n라면|ra-myeon|ราเมียน|🍜||Ramen\\n빵|ppang|ขนมปัง|🍞||Bread\\n우유|u-yu|นม|🥛||Milk\\n계란|gye-ran|ไข่|🥚||Egg\\n커피|keo-pi|กาแฟ|☕||Coffee`,\n  'kr-family': `엄마|eom-ma|แม่|👩||Mom\\n아빠|a-ppa|พ่อ|👨||Dad\\n할머니|hal-meo-ni|คุณย่า/คุณยาย|👵||Grandmother\\n할아버지|hal-a-beo-ji|คุณปู่/คุณตา|👴||Grandfather\\n오빠|o-ppa|พี่ชาย|👦||Older brother\\n언니|eon-ni|พี่สาว|👧||Older sister\\n동생|dong-saeng|น้อง|🧒||Younger sibling\\n아기|a-gi|ทารก|👶||Baby\\n가족|ga-jok|ครอบครัว|👨‍👩‍👧||Family\\n친구|chin-gu|เพื่อน|🧑‍🤝‍🧑||Friend`,\n  'kr-compound': `물|mul|น้ำ|💧||Water\\n고기|go-gi|เนื้อ|🥩||Meat\\n물고기|mul-go-gi|ปลา|🐟||Fish\\n눈|nun|ตา|👁️||Eye\\n물|mul|น้ำ|💧||Water\\n눈물|nun-mul|น้ำตา|😢||Tears\\n불|bul|ไฟ|🔥||Fire\\n고기|go-gi|เนื้อ|🥩||Meat\\n불고기|bul-go-gi|บุลโกกิ|🍖||Bulgogi\\n김|gim|สาหร่าย|🌿||Seaweed\\n밥|bap|ข้าว|🍚||Rice\\n김밥|gim-bap|กิมบับ|🍙||Gimbap`,\n  'en-color': `Red|rɛd|แดง|❤️||Red\\nBlue|bluː|น้ำเงิน/ฟ้า|💙||Blue\\nYellow|ˈjɛl.oʊ|เหลือง|💛||Yellow\\nGreen|ɡriːn|เขียว|💚||Green\\nWhite|waɪt|ขาว|🤍||White\\nBlack|blæk|ดำ|🖤||Black\\nPink|pɪŋk|ชมพู|🩷||Pink\\nOrange|ˈɒr.ɪndʒ|ส้ม|🧡||Orange\\nPurple|ˈpɜː.pəl|ม่วง|💜||Purple\\nBrown|braʊn|น้ำตาล|🤎||Brown`,\n  'en-body': `Eye|aɪ|ตา|👁️||Eye\\nNose|noʊz|จมูก|👃||Nose\\nMouth|maʊθ|ปาก|👄||Mouth\\nEar|ɪər|หู|👂||Ear\\nHand|hænd|มือ|✋||Hand\\nFoot|fʊt|เท้า|🦶||Foot\\nLeg|lɛɡ|ขา|🦵||Leg\\nArm|ɑːm|แขน|💪||Arm\\nTooth|tuːθ|ฟัน|🦷||Tooth\\nTongue|tʌŋ|ลิ้น|👅||Tongue`,\n  'en-food': `Rice|raɪs|ข้าว|🍚||Rice\\nBread|brɛd|ขนมปัง|🍞||Bread\\nEgg|ɛɡ|ไข่|🥚||Egg\\nMilk|mɪlk|นม|🥛||Milk\\nWater|ˈwɔː.tər|น้ำ|💧||Water\\nMeat|miːt|เนื้อ|🥩||Meat\\nFish|fɪʃ|ปลา|🐟||Fish\\nPizza|ˈpiːt.sə|พิซซ่า|🍕||Pizza\\nCake|keɪk|เค้ก|🍰||Cake\\nCoffee|ˈkɒf.i|กาแฟ|☕||Coffee`,\n  'en-family': `Mother|ˈmʌð.ər|แม่|👩||Mother\\nFather|ˈfɑː.ðər|พ่อ|👨||Father\\nSister|ˈsɪs.tər|พี่/น้องสาว|👧||Sister\\nBrother|ˈbrʌð.ər|พี่/น้องชาย|👦||Brother\\nGrandmother|ˈɡræn.mʌð.ər|ย่า/ยาย|👵||Grandmother\\nGrandfather|ˈɡræn.fɑː.ðər|ปู่/ตา|👴||Grandfather\\nBaby|ˈbeɪ.bi|ทารก|👶||Baby\\nFamily|ˈfæm.əl.i|ครอบครัว|👨‍👩‍👧||Family\\nFriend|frɛnd|เพื่อน|🧑‍🤝‍🧑||Friend`,\n  'en-animals': `Cat|kæt|แมว|🐱|\\nDog|dɒg|สุนัข|🐶|\\nBird|bɜːd|นก|🐦|\\nFish|fɪʃ|ปลา|🐟|`\n};\n\n$('preset').addEventListener('change', e => { const val = e.target.value; if(PRESETS[val]){ $('wordsInput').value = PRESETS[val]; render(); } });\n\nconst inputsToSave = ['headerTitle', 'headerSub', 'style', 'wordsPerPage', 'worksheetMode', 'matchPerPage', 'answerKey', 'fontStyle', 'rowCount', 'colCount', 'rowGap', 'fontSize', 'cellSize', 'letterGap', 'squareMode', 'textStyle', 'exampleMode', 'freehandMode', 'inkSaver', 'wordsInput', 'showStars', 'showStartDot', 'paperSize', 'lineStyle', 'cardPos', 'hideDash', 'compoundInput', 'traceLayout', 'traceCols', 'traceCardLang', 'traceRowStyle', 'traceCardColor', 'answerKeyAll'];\n\ndocument.querySelectorAll('.controls input,.controls select,.controls textarea').forEach(el=>{\n  if(el.id==='preset')return;\n  const eventName=el.type==='range'||el.type==='text'||el.tagName==='TEXTAREA'?'input':'change';\n  el.addEventListener(eventName,render);\n});\n\nfunction saveSettings() {\n  const data = {};\n  inputsToSave.forEach(id => { const el = $(id); if (el) data[id] = el.type === 'checkbox' ? el.checked : el.value; });\n  localStorage.setItem('tracingAppSettings', JSON.stringify(data));\n}\n\nfunction loadSettings() {\n  const saved = localStorage.getItem('tracingAppSettings');\n  if (saved) {\n    try {\n      const data = JSON.parse(saved);\n      inputsToSave.forEach(id => {\n        const el = $(id);\n        if (el && data[id] !== undefined) {\n          if (el.type === 'checkbox') el.checked = data[id];\n          else el.value = data[id];\n        }\n      });\n    } catch (e) { console.warn('โหลดค่าไม่ได้'); }\n  }\n}\n\nfunction shouldShowChar(rowIndex, char, mode) {\n  if(!char) return false;\n  if(mode === 'none') return false;\n  if(mode === 'all') return true;\n  return rowIndex === 0;\n}\n\nconst escapeHtml = value => String(value ?? '').replace(/[&<>\"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[char]));\nconst stableHash = value => {let hash=2166136261;for(const char of String(value))hash=Math.imul(hash^char.charCodeAt(0),16777619);return hash>>>0};\nfunction safeImageUrl(value){\n  try{const url=new URL(value);return ['http:','https:'].includes(url.protocol)?url.href:''}catch{return ''}\n}\n\nfunction makeCrossBlock(word, roman, thai, emoji, strokeUrl, rows, cols, exampleMode, freehandMode, showStartDot, showStars){\n  const chars = [...String(word)];\n  const actualCols = Math.max(cols, chars.length); \n  let rowsHtml = '';\n  \n  for(let r=0; r<rows; r++){\n    rowsHtml += `<div class=\"trace-row-cross\"><div class=\"trace-grid-cross\" style=\"grid-template-columns:repeat(${actualCols},1fr)\">`;\n    for(let c=0; c<actualCols; c++){\n      const char = chars[c] || ''; #pinBtn{display:block!important}\n#prev.pinned{position:sticky;top:0;z-index:90}\n#prev.pinned .stage{min-height:90px;padding:4px}\n#prev.pinned #cv,#prev.pinned #pcv{max-height:18dvh}\n#prev.pinned #fb{display:none}\n}\n#pinBtn{display:none;margin:0 0 8px auto;padding:6px 12px;font-size:12px}\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1>🎈 3D Puffy Balloon Studio Pro<\/h1>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n    <button id=\"themeBtn\" class=\"sec\">🎲 สุ่มธีม<\/button>\n    <button id=\"fortuneBtn\" class=\"sec\">🔮 ดวงวันนี้<\/button>\n    <button id=\"mobileBtn\" class=\"sec\" style=\"background:#fdf2f8;color:#db2777;border-color:#fbcfe8\">📱 เปิดในมือถือ/QR<\/button>\n    <button id=\"exportBtn\">💾 บันทึก PNG<\/button>\n    <button id=\"animBtn\" class=\"sec\">✨ APNG<\/button>\n    <button id=\"undoBtn\" class=\"sec\" title=\"ย้อนกลับ (Ctrl+Z)\">↶<\/button><button id=\"redoBtn\" class=\"sec\" title=\"ทำซ้ำ (Ctrl+Shift+Z)\">↷<\/button>\n  <\/div>\n<\/header>\n\n<\!-- Mobile Share & Install Modal -->\n<div id=\"mobileModal\" class=\"modal\">\n  <div class=\"modal-content\">\n    <button class=\"close-modal\" id=\"closeModal\">✕<\/button>\n    <h2 style=\"margin-top:0;border:none;color:var(--acc);font-size:18px\">📱 เปิดและติดตั้งบนมือถือ<\/h2>\n    <p class=\"hint\" style=\"margin-top:8px\">สแกน QR Code ด้วยกล้องมือถือของคุณเพื่อเปิดแอปพลิเคชันนี้ทันที:<\/p>\n    <div id=\"qrcode\" style=\"display:flex;justify-content:center;margin:16px 0;background:#fff;padding:12px;border-radius:12px;border:1px solid var(--line)\"><\/div>\n    <div style=\"margin-bottom:16px\">\n      <input type=\"text\" id=\"shareUrlInput\" readonly style=\"font-size:12px;text-align:center;background:var(--bg)\">\n      <button class=\"sec\" id=\"copyUrlBtn\" style=\"margin-top:8px;width:100%\">📋 คัดลอกลิงก์แอป<\/button>\n    <\/div>\n    <div style=\"text-align:left;background:var(--bg);padding:12px;border-radius:12px;font-size:13px;line-height:1.6\">\n      <strong>วิธีติดตั้งลงหน้าจอมือถือ (PWA):<\/strong><br>\n      • <strong>iOS (Safari):<\/strong> แตะปุ่มแชร์ (Share) ➔ เลือก \"เพิ่มไปยังหน้าจอโฮม\" (Add to Home Screen)<br>\n      • <strong>Android (Chrome):<\/strong> แตะเมนู (จุด 3 จุด) ➔ เลือก \"ติดตั้งแอป\" หรือ \"เพิ่มไปยังหน้าจอหลัก\"\n    <\/div>\n  <\/div>\n<\/div>\n\n<main>\n  <section class=\"card\">\n    <label>ข้อความ (รองรับ ไทย, อังกฤษ, เกาหลี, ญี่ปุ่น, จีน)<\/label>\n    <textarea id=\"text\" rows=\"2\">สุขสันต์วันเกิด 🎂<\/textarea>\n    <div class=\"chips\" id=\"chips\"><\/div>\n    <div style=\"margin-top:8px\"><button class=\"sec\" id=\"trBtn\" style=\"display:none\">🌏 แปลเป็น 5 ภาษา (ไทย/อังกฤษ/เกาหลี/ญี่ปุ่น/จีน)<\/button><\/div>\n    <div class=\"chips\" id=\"trChips\"><\/div>\n    <p class=\"hint\" id=\"trMsg\"><\/p>\n    \n    <label>🎉 แม่แบบตามโอกาส (ตั้งฟอนต์ สี วัสดุ ของตกแต่งให้ทันที)<\/label><select id=\"tpl\"><option value=\"\">-- เลือกแม่แบบ --<\/option><option value=\"0\">🎂 วันเกิด<\/option><option value=\"1\">🎆 ปีใหม่<\/option><option value=\"2\">💝 วาเลนไทน์<\/option><option value=\"3\">🎓 รับปริญญา<\/option><\/select><label>📚 คลังคำคมและแคปชันด่วน<\/label>\n    <select id=\"quoteLib\">\n      <option value=\"\">-- เลือกคำคมหรือแคปชันสำเร็จรูป --<\/option>\n      <option value=\"สุขสันต์วันเกิด 🎂\">สุขสันต์วันเกิด (ไทย)<\/option>\n      <option value=\"สู้ๆ นะคะ 💪\">ให้กำลังใจ สู้ๆ (ไทย)<\/option>\n      <option value=\"คิดถึงจังเลย ❤️\">คิดถึง (ไทย)<\/option>\n      <option value=\"생일 축하해요! 🎈\">생일 축하해요! (เกาหลี)<\/option>\n      <option value=\"사랑해요 💕\">사랑해요 (เกาหลี)<\/option>\n      <option value=\"お誕生日おめでとう ✨\">お誕生日おめでとう (ญี่ปุ่น)<\/option>\n      <option value=\"Happy Birthday 🎉\">Happy Birthday (อังกฤษ)<\/option>\n    <\/select>\n\n    <label>บันทึกคำที่ใช้บ่อย<\/label>\n    <div class=\"row\" style=\"margin-top:4px\"><input type=\"text\" id=\"favInput\" placeholder=\"พิมพ์คำที่ต้องการบันทึก\"><button class=\"sec\" id=\"saveFav\" style=\"padding:10px 12px;white-space:nowrap\">บันทึก<\/button><\/div>\n    <div class=\"chips\" id=\"favChips\"><\/div>\n\n    <h2>🎨 ฟอนต์ & วัสดุลูกโป่ง<\/h2>\n    <label>อัปโหลดฟอนต์ของคุณ (TTF / OTF / WOFF)<\/label><input type=\"file\" id=\"fontFile\" accept=\".ttf,.otf,.woff,.woff2\">\n    <label>ฟอนต์ลายมือ<\/label>\n    <select id=\"font\">\n      <option value=\"Gaegu\">Gaegu (เกาหลี ลายมือกลม)<\/option>\n      <option value=\"Hi Melody\">Hi Melody (เกาหลี น่ารัก)<\/option>\n      <option value=\"Gamja Flower\">Gamja Flower (เกาหลี)<\/option>\n      <option value=\"Mali\">Mali (ไทย ลายมือ)<\/option>\n      <option value=\"Yomogi\">Yomogi (ญี่ปุ่น ลายมือ)<\/option>\n      <option value=\"Ma Shan Zheng\">Ma Shan Zheng (จีน พู่กัน)<\/option>\n      <option value=\"Caveat\">Caveat (อังกฤษ ลายมือ)<\/option>\n    <\/select>\n    <label>วัสดุผิวลูกโป่ง<\/label>\n    <select id=\"mat\">\n      <option value=\"balloon\">🎈 ลูกโป่งเงาสว่าง<\/option>\n      <option value=\"foil\">✨ ฟอยล์เมทัลลิกวาววับ<\/option>\n      <option value=\"holographic\">🌈 โฮโลแกรมรุ้งพาสเทล<\/option>\n      <option value=\"jelly\">🍮 เจลลี่โปร่งแสงดึ๋งดั๋ง<\/option>\n      <option value=\"candycane\">🍬 ลูกกวาดเกลียวแคนดี้<\/option>\n      <option value=\"clay\">🎨 ดินน้ำมันเนื้อด้าน<\/option>\n      <option value=\"neon\">⚡ นีออนเรืองแสง<\/option>\n    <\/select>\n    <label>ชุดสีสำเร็จรูป<\/label>\n    <select id=\"preset\">\n      <option value=\"pink\">ชมพูพาสเทล<\/option>\n      <option value=\"purple\">ม่วงลาเวนเดอร์<\/option>\n      <option value=\"mint\">มิ้นต์สดใส<\/option>\n      <option value=\"yellow\">เหลืองครีมเลมอน<\/option>\n      <option value=\"blue\">ฟ้าแคนดี้สกาย<\/option>\n      <option value=\"sunset\">พระอาทิตย์ตกส้มชมพู<\/option>\n      <option value=\"rainbow\">รุ้งพาสเทลสายไหม<\/option>\n    <\/select>\n    <div class=\"row\" style=\"margin-top:12px\">\n      <label>สีหลัก<\/label><input type=\"color\" id=\"base\" value=\"#ffb3c6\">\n      <label>สีเงา<\/label><input type=\"color\" id=\"shade\" value=\"#e8789a\">\n    <\/div>\n    <div class=\"row\" style=\"margin-top:8px\">\n      <label>เปิดไล่เฉดสี (Gradient)<\/label><input type=\"checkbox\" id=\"gradOn\"><input type=\"color\" id=\"base2\" value=\"#c4b5fd\">\n    <\/div>\n\n    <h2>📐 รูปทรง & จัดวางตัวอักษร<\/h2>\n    <label>การจัดตำแหน่งข้อความหลายบรรทัด<\/label>\n    <select id=\"align\">\n      <option value=\"center\">กึ่งกลาง (Center)<\/option>\n      <option value=\"left\">ชิดซ้าย (Left)<\/option>\n      <option value=\"right\">ชิดขวา (Right)<\/option>\n    <\/select>\n    <label>ความอวบพองลม: <span id=\"depthV\">16<\/span><\/label>\n    <input type=\"range\" id=\"depth\" min=\"8\" max=\"32\" value=\"16\">\n    <label>ความหนาเส้นตัวอักษร: <span id=\"thickV\">6<\/span>%<\/label>\n    <input type=\"range\" id=\"thick\" min=\"0\" max=\"30\" value=\"6\">\n    <label>ระยะห่างระหว่างตัวอักษร: <span id=\"spaceV\">8<\/span>%<\/label>\n    <input type=\"range\" id=\"space\" min=\"0\" max=\"30\" value=\"8\">\n    <label>ขนาดตัวอักษร: <span id=\"sizeV\">110<\/span>px<\/label>\n    <input type=\"range\" id=\"size\" min=\"60\" max=\"180\" value=\"110\">\n    <label>ดัดโค้งข้อความ: <span id=\"curveV\">0<\/span><\/label>\n    <input type=\"range\" id=\"curve\" min=\"-100\" max=\"100\" value=\"0\">\n\n    <h2>🖼️ ขอบสติกเกอร์ & พื้นหลัง<\/h2>\n    <label>ขอบสติกเกอร์หนา: <span id=\"stkV\">8<\/span>px<\/label>\n    <input type=\"range\" id=\"stk\" min=\"0\" max=\"28\" value=\"8\">\n    <div class=\"row\" style=\"margin-top:8px\"><label>สีขอบสติกเกอร์<\/label><input type=\"color\" id=\"stkColor\" value=\"#ffffff\"><\/div>\n    <div class=\"row\" style=\"margin-top:12px\"><label>ใส่สีพื้นหลังพรีวิว<\/label><input type=\"checkbox\" id=\"bgOn\"><input type=\"color\" id=\"bg\" value=\"#fff1f5\"><\/div>\n    <label>รูปแบบพื้นหลัง<\/label>\n    <select id=\"bgPattern\">\n      <option value=\"solid\">สีพื้นเรียบ<\/option>\n      <option value=\"dots\">ลายจุด Polka Dots<\/option>\n      <option value=\"stars\">ลายดาวระยิบระยับ<\/option>\n      <option value=\"grid\">ลายตารางน่ารัก<\/option>\n    <\/select>\n    <label>หรืออัปโหลดรูปพื้นหลังเอง<\/label><input type=\"file\" id=\"bgFile\" accept=\"image/*\"><button class=\"sec\" id=\"bgClr\" style=\"margin-top:6px\">ล้างรูปพื้นหลัง<\/button>\n\n    <h2>👆 ปรับแต่งทีละตัวอักษร (แตะ/ลากบนรูปเพื่อย้าย)<\/h2>\n    <p class=\"hint\" id=\"lsel\">แตะตัวอักษรบนรูปเพื่อเลือกปรับแต่ง<\/p>\n    <label>หมุนตัวอักษร: <span id=\"lrotV\">0<\/span>°<\/label><input type=\"range\" id=\"lrot\" min=\"-45\" max=\"45\" value=\"0\">\n    <label>ขยาย/ย่อตัวอักษร: <span id=\"lscaleV\">100<\/span>%<\/label><input type=\"range\" id=\"lscale\" min=\"60\" max=\"160\" value=\"100\">\n    <div style=\"margin-top:10px;display:flex;gap:8px;flex-wrap:wrap\"><button class=\"sec\" id=\"jig\">🎲 สุ่มเด้งดึ๋งอิสระ<\/button><button class=\"sec\" id=\"rstL\">↺ รีเซ็ตตำแหน่ง<\/button><\/div>\n\n    <h2>✨ ของตกแต่งรอบข้อความ<\/h2>\n    <div class=\"row\" style=\"margin-top:8px\"><label>แสดงของตกแต่ง<\/label><input type=\"checkbox\" id=\"decor\" checked><\/div>\n    <label>รูปทรงของตกแต่งหลัก<\/label>\n    <select id=\"dshape\"><option value=\"heart\">หัวใจ ♥<\/option><option value=\"star\">ดาว ★<\/option><option value=\"bow\">โบว์ 🎀<\/option><option value=\"crown\">มงกุฎ 👑<\/option><option value=\"sparkle\">ประกายวิบวับ ✦<\/option><\/select>\n    <label>ขนาดของตกแต่ง: <span id=\"dsizeV\">100<\/span>%<\/label>\n    <input type=\"range\" id=\"dsize\" min=\"50\" max=\"160\" value=\"100\">\n    <div style=\"margin-top:10px\"><button class=\"sec\" id=\"resetPos\">รีเซ็ตตำแหน่งของตกแต่ง<\/button><\/div>\n    <label>เพิ่มของตกแต่งอิสระ<\/label><div class=\"chips\" id=\"xtra\"><\/div><div style=\"margin-top:8px\"><button class=\"sec\" id=\"xdel\">ลบชิ้นล่าสุด<\/button><\/div>\n\n    <h2>💫 เอฟเฟกต์ลูกโป่งเพิ่มเติม<\/h2>\n    <div class=\"row\" style=\"margin-top:8px\"><label>จุดไฮไลท์สะท้อนแสงกระจก<\/label><input type=\"checkbox\" id=\"glint\" checked><\/div>\n    <div class=\"row\" style=\"margin-top:8px\"><label>ประกายดาววิบวับ (Sparkles)<\/label><input type=\"checkbox\" id=\"spark\" checked><\/div>\n    <div class=\"row\" style=\"margin-top:8px\"><label>เงาดรอปชาโดว์ใต้ตัวอักษร<\/label><input type=\"checkbox\" id=\"shadow\" checked><\/div>\n\n    <h2>🎬 เคลื่อนไหวสด & การตั้งค่า<\/h2>\n    <label>รูปแบบอนิเมชัน<\/label><select id=\"motion\"><option value=\"bounce\">เด้งดึ๋ง 🎈<\/option><option value=\"swing\">แกว่งเบาๆ 🍃<\/option><option value=\"shake\">สั่นดุ๊กดิ๊ก ⚡<\/option><\/select>\n    <div class=\"row\" style=\"margin-top:8px\"><label>เล่นพรีวิวเคลื่อนไหวสด<\/label><input type=\"checkbox\" id=\"live\"><\/div>\n    <div style=\"margin-top:10px;display:flex;gap:8px;flex-wrap:wrap\"><button class=\"sec\" id=\"saveSet\">💾 บันทึกการตั้งค่า<\/button><button class=\"sec\" id=\"clrSet\">🗑️ ล้างการตั้งค่า<\/button><\/div>\n\n    <label>📁 ชุดตั้งค่าหลายแบบ<\/label><div class=\"row\" style=\"gap:8px;margin-top:4px\"><select id=\"bpSel\" style=\"flex:1\"><\/select><button class=\"sec\" id=\"bpLoad\">โหลด<\/button><button class=\"sec\" id=\"bpDel\">ลบ<\/button><\/div><div class=\"row\" style=\"gap:8px;margin-top:8px\"><input type=\"text\" id=\"bpName\" placeholder=\"ชื่อชุด เช่น วันเกิดชมพู\"><button class=\"sec\" id=\"bpSave\" style=\"white-space:nowrap\">บันทึกชุดนี้<\/button><\/div><h2>🖼️ โปสเตอร์หลายกล่องข้อความ<\/h2>\n    <div class=\"row\" style=\"margin-top:8px\"><label>เปิดโหมดโปสเตอร์<\/label><input type=\"checkbox\" id=\"pOn\"><\/div>\n    <label>ขนาดผืนผ้าใบ<\/label><select id=\"pSize\"><option value=\"1080,1350\">โพสต์ IG 1080×1350<\/option><option value=\"1080,1080\">จัตุรัส 1080×1080<\/option><option value=\"1080,1920\">สตอรี่ 1080×1920<\/option><option value=\"1600,900\">แนวนอน 1600×900<\/option><\/select>\n    <div id=\"pBoxes\"><\/div>\n    <div style=\"margin-top:8px;display:flex;gap:8px;flex-wrap:wrap\"><button class=\"sec\" id=\"pAdd\">➕ เพิ่มกล่อง<\/button><button class=\"sec\" id=\"pSave\">💾 บันทึกโปสเตอร์ PNG<\/button><\/div>\n    <p class=\"hint\">เปิดโหมดแล้วลากกล่องบนภาพเพื่อย้าย ทุกกล่องใช้ฟอนต์ วัสดุ และความอวบจากส่วนด้านบน แต่ตั้งข้อความ ขนาด และสีของตัวเองได้ (กล่องในโปสเตอร์ไม่มีของตกแต่งรอบข้อความ)<\/p>\n\n    <h2>📦 ส่งออก & สร้างชุดสติกเกอร์<\/h2>\n    <label>ความละเอียดส่งออกภาพ<\/label><select id=\"xscale\"><option value=\"1\">1x (มาตรฐาน)<\/option><option value=\"2\">2x (คมชัด)<\/option><option value=\"3\">3x (คมชัดสูง)<\/option><option value=\"4\">4x (Ultra HD)<\/option><\/select>\n    <label>ขนาดมาตรฐาน (เลือกอัตโนมัติเมื่อส่งออก)<\/label><select id=\"xfmt\"><option value=\"orig\">ขนาดต้นฉบับพอดีตัวอักษร<\/option><option value=\"line\">สติกเกอร์ LINE (370×320)<\/option><option value=\"linemain\">ภาพหลัก LINE (240×240)<\/option><option value=\"emoji\">อีโมจิ LINE (180×180)<\/option><option value=\"square\">สี่เหลี่ยมจัตุรัส (1080×1080)<\/option><\/select>\n    <label>สร้างชุดสติกเกอร์ ZIP (พิมพ์ข้อความละ 1 บรรทัด)<\/label><textarea id=\"pack\" rows=\"3\">สวัสดี\nขอบคุณ\nสู้ๆ นะ<\/textarea>\n    <div style=\"margin-top:8px\"><button class=\"sec\" id=\"packBtn\">📥 สร้างและดาวน์โหลด ZIP<\/button><\/div>\n    <div style=\"margin-top:8px;display:flex;gap:8px;flex-wrap:wrap\"><button class=\"sec\" id=\"linePackBtn\">🟢 ชุด LINE ครบ (main + tab + สติกเกอร์)<\/button><button class=\"sec\" id=\"linkBtn\">🔗 คัดลอกลิงก์การตั้งค่า<\/button><\/div>\n    <p class=\"hint\">ชุด LINE: รูปแรกใช้เป็น main (240×240) และ tab (96×74) สติกเกอร์ 370×320 จำนวนที่ LINE รับคือ 8/16/24/32/40 รูป ไฟล์ละไม่เกิน 1MB<\/p>\n  <\/section>\n\n  <section class=\"card\" id=\"prev\">\n    <button class=\"sec\" id=\"pinBtn\" type=\"button\">📌 ปักพรีวิวไว้ด้านบน<\/button>\n    <div class=\"stage\"><canvas id=\"cv\"><\/canvas><canvas id=\"pcv\" style=\"display:none\"><\/canvas><\/div>\n    <p class=\"hint\">💡 พื้นหลังโปร่งใส 100% อัตโนมัติ (ลายตารางเป็นเพียงตัวช่วยดูตอนพรีวิว) — สามารถลากเลื่อนตัวอักษรหรือของตกแต่งบนภาพได้โดยตรง!<\/p>\n    <p class=\"hint\" id=\"msg\" style=\"font-weight:700;color:var(--acc)\"><\/p>\n    <div id=\"fb\" style=\"text-align:center;margin-top:12px\"><\/div>\n  <\/section>\n<\/main>\n\n<script>\nconst PG=async n=>{try{if(window.claude)return await claude.use(n)}catch(e){}try{return await parent.pgUse(n)}catch(e){}return null};\nconst $=id=>document.getElementById(id);\nconst cv=$('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});\nconst PRESETS={\n  pink:['#ffb3c6','#e8789a'],\n  purple:['#d8b4fe','#9f67e8'],\n  mint:['#9ef0dc','#2fb8a0'],\n  yellow:['#fde68a','#e8b923'],\n  blue:['#a5cdfd','#5a8fe0'],\n  sunset:['#fed7aa','#f97316'],\n  rainbow:['#fbcfe8','#a5f3fc']\n};\nconst ALL=['Gaegu','Mali','Yomogi','Ma Shan Zheng','Hi Melody','Caveat'];\nconst CHIPS=[['สวัสดี','Mali'],['안녕하세요','Gaegu'],['こんにちは','Yomogi'],['你好','Ma Shan Zheng'],['Hello','Caveat'],['Love','Caveat']];\nconst hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));\nconst stack=p=>[p,...ALL.filter(f=>f!==p)].map(f=>`\"${f}\"`).join(',')+',cursive,sans-serif';\nconst fresh=()=>({hl:{x:0,y:0},hr:{x:0,y:0},a:{x:0,y:0},b:{x:0,y:0},c:{x:0,y:0},d:{x:0,y:0}});\nlet off=fresh(),hits=[];\n\nfunction blur(a,w,h,r){\n  if(w<=0||h<=0)return;\n  const t=new Float32Array(w*h),n=2*r+1;\n  for(let pass=0;pass<3;pass++){\n    for(let y=0;y<h;y++){const o=y*w;let s=0;\n      for(let x=-r;x<=r;x++)s+=a[o+Math.min(w-1,Math.max(0,x))];\n      for(let x=0;x<w;x++){t[o+x]=s/n;s+=a[o+Math.min(w-1,x+r+1)]-a[o+Math.max(0,x-r)];}}\n    for(let x=0;x<w;x++){let s=0;\n      for(let y=-r;y<=r;y++)s+=t[Math.min(h-1,Math.max(0,y))*w+x];\n      for(let y=0;y<h;y++){a[y*w+x]=s/n;s+=t[Math.min(h-1,y+r+1)*w+x]-t[Math.max(0,y-r)*w+x];}}\n  }\n}\nfunction heart(c,x,y,s,rot){\n  c.save();c.translate(x,y);c.rotate(rot);c.translate(0,-s*.5);c.beginPath();\n  c.moveTo(0,s*.3);c.bezierCurveTo(0,-s*.1,-s*.6,-s*.1,-s*.6,s*.3);\n  c.bezierCurveTo(-s*.6,s*.65,-s*.1,s*.8,0,s);c.bezierCurveTo(s*.1,s*.8,s*.6,s*.65,s*.6,s*.3);\n  c.bezierCurveTo(s*.6,-s*.1,0,-s*.1,0,s*.3);c.closePath();c.fill();c.stroke();c.restore();\n}\nfunction star(c,x,y,s,rot){\n  c.save();c.translate(x,y);c.rotate(rot);c.beginPath();\n  for(let i=0;i<10;i++){const r=i%2?s*.4:s*.8,a=-Math.PI/2+i*Math.PI/5;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}\n  c.closePath();c.fill();c.stroke();c.restore();\n}\nfunction bow(c,x,y,s,rot){\n  c.save();c.translate(x,y);c.rotate(rot);\n  c.beginPath();c.moveTo(-s*.1,s*.05);c.lineTo(-s*.4,s*.7);c.lineTo(-s*.12,s*.58);c.lineTo(0,s*.78);c.lineTo(s*.12,s*.58);c.lineTo(s*.4,s*.7);c.lineTo(s*.1,s*.05);c.closePath();c.fill();c.stroke();\n  c.beginPath();\n  c.moveTo(0,0);c.bezierCurveTo(-s*.35,-s*.65,-s*.95,-s*.6,-s*.85,0);c.bezierCurveTo(-s*.78,s*.5,-s*.3,s*.35,0,0);\n  c.moveTo(0,0);c.bezierCurveTo(s*.35,-s*.65,s*.95,-s*.6,s*.85,0);c.bezierCurveTo(s*.78,s*.5,s*.3,s*.35,0,0);\n  c.closePath();c.fill();c.stroke();\n  c.beginPath();c.arc(0,0,s*.2,0,Math.PI*2);c.fill();c.stroke();\n  c.restore();\n}\nfunction crown(c,x,y,s,rot){\n  c.save();c.translate(x,y);c.rotate(rot);c.beginPath();\n  c.moveTo(-s*.6,s*.4);c.lineTo(-s*.68,-s*.3);c.lineTo(-s*.3,0);c.lineTo(0,-s*.5);c.lineTo(s*.3,0);c.lineTo(s*.68,-s*.3);c.lineTo(s*.6,s*.4);c.closePath();c.fill();c.stroke();\n  [[-.68,-.3],[0,-.5],[.68,-.3]].forEach(p=>{c.beginPath();c.arc(p[0]*s,p[1]*s,s*.1,0,Math.PI*2);c.fill();c.stroke()});\n  c.restore();\n}\nfunction sparkleShape(c,x,y,s,rot){\n  c.save();c.translate(x,y);c.rotate(rot);sparkle(c,0,0,s);c.fill();c.stroke();c.restore();\n}\nconst SHAPES={heart,star,bow,crown,sparkle:sparkleShape};\nfunction sparkle(c,x,y,s){\n  c.beginPath();c.moveTo(x,y-s);c.quadraticCurveTo(x,y,x+s,y);c.quadraticCurveTo(x,y,x,y+s);\n  c.quadraticCurveTo(x,y,x-s,y);c.quadraticCurveTo(x,y,x,y-s);c.fill();\n}\n\nlet SC=1,animT=null,sel=null,lt={},nCl=0,extras=[],bgImg=null,playTimer=null;\nconst gO=k=>k[0]==='L'?(lt[k]||(lt[k]={x:0,y:0,r:0,s:1})):k[0]==='X'?extras[+k.slice(1)]:off[k];\n\nasync function render(){\n  const raw=$('text').value||'안녕하세요',fam=$('font').value;\n  const size=Math.max(10, +$('size').value*SC);\n  const depth=Math.max(2, +$('depth').value*SC);\n n></div></div>`;

    }catch(err){toast(err&&err.code==='not_granted'?'ยังไม่ได้อนุญาตให้หน้านี้ใช้ Claude':err&&err.code==='rate_limited'?'ส่งคำขอถี่เกินไป ลองใหม่อีกครั้งใน 1 นาที':'สร้างบทฝึกไม่สำเร็จ ลองอีกครั้ง')}

function tool(t){const ws=S.words.filter(w=>(w[srcLang]||'').trim());const opt=(v,none)=>(none?'<option value="">ไม่แสดงความหมาย</option>':'')+LANGS.map(l=>`<option value="${l[0]}" ${v===l[0]?'selected':''}>${l[1]}</option>`).join('');

  <section class="creation-workspace"><div class="creation-workspace-head"><div><span class="creation-live-dot"></span><strong>${t==='handwriting'?'ใบงานคัดลายมือ':'ตัวอักษรลูกโป่ง'}</strong></div></div><div class="creation-frame-wrap"><iframe id="fr" title="สตูดิโอสร้างสรรค์"></iframe></div></section></div>`;
  $('#fr').srcdoc=TOOLS[t];

const baseToolWithFullscreen=tool;
tool=function(t){
  baseToolWithFullscreen(t);
  const frameWrap=$('.creation-frame-wrap'),head=$('.creation-workspace-head');
  if(!frameWrap||!head)return;
  head.insertAdjacentHTML('beforeend','<button type="button" class="button button-outline tool-fullscreen-trigger" id="toolFullscreen" aria-pressed="false">⛶ เปิดเต็มจอ</button>');
  frameWrap.insertAdjacentHTML('beforeend','<button type="button" class="creation-fullscreen-exit" id="toolFullscreenExit">✕ กลับหน้าแอป</button>');
  const enter=$('#toolFullscreen'),exit=$('#toolFullscreenExit');
  let previousScroll=0;
  const setFullscreen=open=>{
    if(open)previousScroll=window.scrollY;
    frameWrap.classList.toggle('is-fullscreen',open);
    document.body.classList.toggle('tool-fullscreen-open',open);
    enter.setAttribute('aria-pressed',String(open));
    if(open)exit.focus();else{window.scrollTo(0,previousScroll);enter.focus()}
  };
  enter.onclick=()=>setFullscreen(true);
  exit.onclick=()=>setFullscreen(false);
  if(window.__pgToolFullscreenEsc)removeEventListener('keydown',window.__pgToolFullscreenEsc);
  window.__pgToolFullscreenEsc=e=>{
    if(e.key==='Escape'&&frameWrap.classList.contains('is-fullscreen'))setFullscreen(false);
  };
  addEventListener('keydown',window.__pgToolFullscreenEsc);
};

<script>
(function(){
  const stamp=()=>new Date().toISOString();
  const CEFR_LEVELS=['A1','A2','B1','B2','C1','C2'];
  const statusNames={learning:'กำลังเรียน',practicing:'กำลังฝึก',review:'ต้องทบทวน',mastered:'จำได้แม่นแล้ว'};
  S.words.forEach((w,i)=>{
    if(typeof w.order!=='number')w.order=i;
    if(w.level==null)w.level='';
    if(w.workStatus==null)w.workStatus='learning';
    if(w.note==null)w.note='';
    if(w.colorTag==null)w.colorTag='';
    if(w.createdAt===undefined)w.createdAt='';
    if(w.updatedAt===undefined)w.updatedAt='';
  });
  save();
  const vocabStyle=document.createElement('style');
  vocabStyle.textContent='.vocab-extra{font-size:10px;color:hsl(var(--muted-foreground));margin-top:5px;line-height:1.5}.vocab-note{font-size:11px;margin-top:4px;overflow-wrap:anywhere}.vocab-level-filter{max-width:190px}.vocab-status{min-width:115px;padding:6px 8px;font-size:11px}.vocab-color-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;border:1px solid #888;vertical-align:middle}.vocab-table .vc-main{border-left:3px solid transparent;padding-left:10px}.vocab-actions-row{display:flex;gap:3px;flex-wrap:wrap}';
  document.head.appendChild(vocabStyle);
  let levelFilter='';
  const oldList=list;
  function rowFor(id){return S.words.find(w=>w.id===id)}
  function colorValue(value){return /^#[0-9a-f]{6}$/i.test(value||'')?value:''}
  function when(value){if(!value)return '—';const d=new Date(value);return Number.isNaN(+d)?'—':d.toLocaleDateString()}
  function storeWord(w){w.updatedAt=stamp();save()}
  function decorateRows(){
    const root=$('#vlist');if(!root)return;
    root.querySelectorAll('tr').forEach(tr=>{
      const ref=tr.querySelector('[data-r]')||tr.querySelector('[data-c]')||tr.querySelector('[data-x]');
      if(!ref)return;
      const w=rowFor(ref.dataset.r||ref.dataset.c||ref.dataset.x);if(!w)return;
      tr.dataset.wordId=w.id;
      const main=tr.querySelector('.vc-main');

        main.style.borderLeftColor=colorValue(w.colorTag)||'transparent';
        main.insertAdjacentHTML('beforeend',`<div class="vocab-extra">Created ${when(w.createdAt)} · Updated ${when(w.updatedAt)}</div>${w.note?`<div class="vocab-note">${esc(w.note)}</div>`:''}`);
        const title=main.querySelector('.thai-word');
        if(title&&colorValue(w.colorTag))title.insertAdjacentHTML('afterbegin',`<span class="vocab-color-dot" style="background:${colorValue(w.colorTag)}" title="แท็กสี"></span>`);
      }
      const level=tr.querySelector('.vc-level');
      if(level)level.innerHTML=`<span class="tag">${esc(w.level||'ไม่ระบุระดับ')}</span>`;
      const langs=tr.querySelector('.vc-langs');
      if(langs)langs.insertAdjacentHTML('beforeend',`<div class="vocab-extra">${esc(statusNames[w.workStatus]||w.workStatus||'กำลังเรียน')}</div>`);
      const actionBox=tr.querySelector('.table-actions');
      if(actionBox&&!actionBox.dataset.extended){
        actionBox.dataset.extended='1';
        const addButton=(label,title,handler)=>{
          const b=document.createElement('button');b.type='button';b.className='mini-action';b.textContent=label;b.title=title;b.setAttribute('aria-label',title);b.addEventListener('click',handler);actionBox.appendChild(b);
        };
        addButton('⧉','ทำสำเนาคำ',()=>{
          const copy={...w,id:'w'+Date.now()+'-'+Math.random().toString(36).slice(2,7),createdAt:stamp(),updatedAt:stamp(),last:'',favorite:false,order:Math.max(-1,...S.words.map(x=>Number(x.order)||0))+1};
          S.words.push(copy);save();list();toast('ทำสำเนาคำแล้ว');
        });
        addButton('✎','แก้ระดับ โน้ต และแท็กสี',()=>{
          const levelValue=prompt('Level (CEFR A1–C2, or another level)',w.level||'');if(levelValue===null)return;
          const statusValue=prompt('Work status: learning / practicing / review / mastered',w.workStatus||'learning');if(statusValue===null)return;
          const noteValue=prompt('โน้ตสำหรับคำนี้',w.note||'');if(noteValue===null)return;

  const stickerMarkup='<label style="display:flex;align-items:center;gap:8px;margin:8px 0"><input type="checkbox" id="autoWrap" checked>ตัดบรรทัดข้อความอัตโนมัติ</label><label style="display:flex;align-items:center;gap:8px;margin:8px 0"><input type="checkbox" id="italicText">ตัวเอียง</label>';

  const wrapFunction="function pgAutoWrapText(value){if(!$('autoWrap').checked)return value;const size=+$('size').value,fontName=$('font').value,probe=document.createElement('canvas').getContext('2d');probe.font=($('italicText').checked?'italic ':'')+size+'px '+stack(fontName);const limit=Math.max(180,Math.min(520,size*5));const segmenter=window.Intl&&Intl.Segmenter?new Intl.Segmenter(undefined,{granularity:'grapheme'}):null;return String(value).split('\\n').map(line=>{const chars=segmenter?[...segmenter.segment(line)].map(x=>x.segment):Array.from(line);let out=[],current='';for(const ch of chars){if(current&&probe.measureText(current+ch).width>limit){out.push(current.trimEnd());current=ch.trimStart()}else current+=ch}out.push(current);return out.join('\\n')}).join('\\n')}\nasync function render(){";

    const json=new TextEncoder().encode(JSON.stringify(metadata,null,2));
    return oldZip(files.filter(f=>f.name!=='sticker-pack.json').concat([{name:'sticker-pack.json',data:json}]));
  };

  const stickerGroupsCode=`
(function(){
  if(!matchMedia('(max-width:919px)').matches)return;
  const card=document.querySelector('main>.card');
  if(!card||card.dataset.mobileGroups)return;

  document.head.appendChild(style);

    details.classList.add('pg-sticker-accordion');
    const body=document.createElement('div');body.className='pg-sticker-accordion-body';

    let node=templateLabel;
    while(node&&node!==firstGroup){const next=node.nextSibling;body.appendChild(node);node=next}
  }
  card.dataset.mobileGroups='ready';
})();`;
